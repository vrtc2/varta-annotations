syntax = "proto3";

package varta.task.catalog.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/vrtc2/varta-annotations/gen/go/varta/task/catalog/v1;catalogv1";

// Task annotations.
//
// Apply these options to your own protobuf messages, fields, oneofs and enum
// values so Varta can render them as a task input form and present the task in
// the catalog.

// Widget hints which input control Varta renders for a field.
enum Widget {
  WIDGET_UNSPECIFIED = 0;
  WIDGET_INTEGER = 1;
  WIDGET_FLOAT = 2;
  WIDGET_TEXT = 3;
  WIDGET_TEXTAREA = 4;
  WIDGET_COORDINATES = 5;
  WIDGET_DATE = 6;
  WIDGET_DATETIME = 7;
  WIDGET_ENUM = 8;
  WIDGET_BOOLEAN = 9;
  WIDGET_MAP_POINT = 10;
  WIDGET_WAYPOINTS = 11;
  WIDGET_WAYPOINTS_ITEM = 12;
  // Color input with a picker. The field is a string holding a hex color
  // ("#3b82f6").
  WIDGET_COLOR = 13;
  // Entity picker. The field is a string holding the chosen entity id; the
  // offered entities are narrowed via EntityIdWidgetOptions.
  WIDGET_ENTITY_ID = 14;
}

message FieldUI {
  Widget widget = 1;
  string label = 2;
  string placeholder = 3;
  bool required = 4;
  string hint = 5;

  // Where the field sits in the form. Unset: on a line of its own, one under
  // another in the order of the message, as forms without layout are drawn.
  FieldLayout layout = 6;

  // Per-widget options. Set the variant matching `widget`; widgets without
  // options leave it unset.
  oneof options {
    EntityIdWidgetOptions entity_id = 100;
    IntegerWidgetOptions integer = 101;
    FloatWidgetOptions float = 102;
    TextWidgetOptions text = 103;
  }
}

// FieldLayout places a field in the form: in a section, beside the other
// fields of its row, with a share of the row's width. The order of fields is
// the order of the message, so a renderer that ignores layout still draws them
// in a sensible order, one under another.
message FieldLayout {
  // Id of the section the field is in, like "where". The fields of a section
  // are adjacent in the message; fields without a section come before every
  // section, without a heading.
  string section = 1;

  // The section's heading. Set on the section's first field; the others leave
  // it empty.
  string section_title = 2;

  // Id of the field's row, like "r2". Adjacent fields of a section with the
  // same row share a line; empty means a line of its own. A row that does not
  // fit the form's width is drawn as a column, its fields one under another.
  string row = 3;

  // The field's share of its row's width, relative to the other fields in it.
  // Unset means 1.
  optional uint32 weight = 4;

  // How tall a big widget is drawn: a map, a route, a multiline text. Other
  // widgets have one height and ignore it.
  FieldHeight height = 5;
}

enum FieldHeight {
  // The widget's own.
  FIELD_HEIGHT_UNSPECIFIED = 0;
  FIELD_HEIGHT_SMALL = 1;
  FIELD_HEIGHT_MEDIUM = 2;
  FIELD_HEIGHT_LARGE = 3;
}

// Options for WIDGET_ENTITY_ID.
message EntityIdWidgetOptions {
  // RE2 regexp the entity id must match to be offered (e.g. "^drone-").
  // Empty matches every entity.
  string id_regexp = 1;
  // Narrows candidates relative to the entity the form was opened on; AND-ed
  // with id_regexp. A form opened without an entity offers nothing for a
  // scope other than UNSPECIFIED.
  EntityIdScope scope = 2;
}

enum EntityIdScope {
  // Every entity the user can see.
  ENTITY_ID_SCOPE_UNSPECIFIED = 0;
  // Entities whose parent is the context entity.
  ENTITY_ID_SCOPE_CONTEXT_CHILDREN = 1;
  // Entities with the context entity anywhere in their parent chain.
  ENTITY_ID_SCOPE_CONTEXT_DESCENDANTS = 2;
}

// Options for WIDGET_INTEGER.
message IntegerWidgetOptions {
  optional int64 min = 1;
  optional int64 max = 2;

  // How much the ± buttons add or subtract, and the grid the typed value snaps
  // to. Unset means 1. Must be a whole number — the widget never produces a
  // fraction.
  optional int64 step = 3;
}

// Options for WIDGET_FLOAT.
message FloatWidgetOptions {
  optional double min = 1;
  optional double max = 2;
  optional double step = 3;

  // Digits after the decimal point the input keeps. Unset means Varta picks;
  // 0 renders the number without a fraction. Set it whenever the field needs
  // more precision than a couple of digits (coordinates, ratios) — the value is
  // rounded to this many digits, so a too-small setting silently truncates what
  // the user typed.
  optional uint32 decimal_places = 4;
}

// Options for WIDGET_TEXT and WIDGET_TEXTAREA.
message TextWidgetOptions {
  // Longest value the input accepts, in characters. Unset means unlimited.
  optional uint32 max_length = 1;
}

// Extend field options
extend google.protobuf.FieldOptions {
  FieldUI field = 70101;
}

// Optionally extend message options to mark this message as a Task
message TaskDefinition {
  string name = 1;
  string description = 2;
  string category = 3;
  int32 sort = 4;
}

extend google.protobuf.MessageOptions {
  TaskDefinition task = 70102;
}

message EnumValueUI {
  string label = 1;
  string description = 2;
}

extend google.protobuf.EnumValueOptions {
  EnumValueUI enum_value = 70101;
}

message OneofValueUI {
  string label = 1;
  string description = 2;
}

extend google.protobuf.FieldOptions {
  OneofValueUI oneof_value = 70102;
}

extend google.protobuf.OneofOptions {
  FieldUI oneof_field = 70101;
}
